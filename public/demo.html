  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: 16px !important;
  height: 16px !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

html&gt;body{padding:0}&lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
&lt;div id=&quot;growth-engine&quot;&gt;
&lt;h1 class=&quot;rg-sr&quot;&gt;会员增长经营引擎&lt;/h1&gt;
  &lt;style&gt;
    /* Hallmark · pre-emit critique: P5 H5 E5 S5 R4 V4
     * macrostructure: Workbench (admin console) · genre: modern-minimal
     * nav: N3 side-rail (grouped + collapsible) · footer: none (app shell)
     * theme: custom · vibe: &quot;Klaviyo admin console over prospectus voice&quot;
     *   canvas oklch(.970 .003 264) #F4F5F7 · surface oklch(1 0 0)
     *   accent oklch(.512 .172 250) #0067C4 cool
     *   display + body: Archivo / Noto Sans SC (grotesk-sans)
     * axes: light-canvas / grotesk-sans / cool + semantic
     * tone: 可核验、敛定、不喂 · enrichment: none (typography only)
     * DNA-source: Klaviyo 后台的结构惯例 + 本仓前两轮已落地的品牌色阶。
     *   线上 CSS 抓不到(WebFetch 剥样式、后台在登录墙后),故未标注任何&quot;精确取自 Klaviyo&quot;的色值。
     * ============================================================================
       会员增长经营引擎 —— 后台控制台版式 (admin console)
       参照 Klaviyo 后台的表层语言:浅灰画布 + 白色面板 + 8px 圆角 + 一档极淡投影;
       信息落在后台惯例里 —— 固定外壳(顶栏 / 左栏)+ 独立滚动工作区 + 页头(面包屑·标题·
       时间范围·主操作)+ 表格工具条 + 粘性表头的密集表 + 结果计数与分页 + 空态。

       语义色在本版承重:绿 = 优于基准,红 = 劣于基准,琥珀 = 在学习、还没有可归因的数,
       蓝(标记墨)= 结构与结论,灰 = 中性。

       但颜色不是唯一通道 —— 这一条不让:
         · 涨跌一律附 ▲▼ 与显式正负号,去掉颜色仍读得出方向
         · 状态胶囊一律「圆点 + 文字」,不靠底色认状态
         · 数据条在同一位置附数值
       黑白打印、红绿色盲、投影仪偏色下都不丢信息。
       语义色实测(sRGB 内,未裁切):
         --pos  #007A2D 对纸 5.49:1 · 对自身淡底 4.72:1
         --neg  #D10014 对纸 5.64:1 · 对自身淡底 4.75:1
         --warn #985E00 对纸 5.34:1 · 对自身淡底 4.63:1
         --mark #0067C4 对纸 5.62:1 · 对自身淡底 4.88:1
       亮档只铺填充与淡底、不承载文字,按图形边界 3:1 量:
         --pos-bright #00A138 3.41 · --neg-bright #EF3126 4.09
         --warn-bright #CB8000 3.17 · --mark-bright #008EFF 3.33
       以上是 Chrome 实渲后取的像素值(oklch 出界那一档由浏览器映射回 sRGB),不是纸面换算
       ============================================================================ */

    /* 宿主契约用 !important 锁住 :root 背景,只能从它读的变量改 —— 让三层落在同一张纸上 */
    :root{--background:#f4f5f7;--foreground:#14161f;color-scheme:light}
    html,body{height:100%}

    #growth-engine{
      /* ---- 表面模型:画布 / 面板 / 边线。后台控制台的三层纸 ---- */
      --canvas:oklch(.970 .003 264);            /* 页面画布 #F4F5F7 */
      --surface:oklch(1 0 0);                   /* 面板:白 */
      --surface-2:oklch(.982 .003 264);         /* 表头与内嵌区的次级面 */
      --surface-3:oklch(.962 .004 264);         /* 行悬停 / 按下 */
      --border:oklch(.900 .006 264);            /* 面板边线 #DCDEE2 */
      --border-input:oklch(.630 .016 264);      /* 表单控件边界。3:1 要对最深的那张纸(工具条 --surface-2)成立,不是只对纯白成立 */
      --radius-sm:4px; --radius:6px; --radius-lg:8px; --radius-pill:999px;
      --shadow-sm:0 1px 2px oklch(.20 .04 264/.07), 0 1px 1px oklch(.20 .04 264/.04);
      --shadow-md:0 6px 16px oklch(.20 .04 264/.10), 0 1px 3px oklch(.20 .04 264/.06);
      --shadow-pop:0 12px 32px oklch(.20 .04 264/.16), 0 2px 6px oklch(.20 .04 264/.08);

      --paper:var(--surface);
      --ink:oklch(.195 .045 264);                                    /* 正文墨:蓝黑墨水 */
      --mark:oklch(.512 .172 250);                                   /* 标记墨 #0067C4,白字压上去 5.62:1 */
      --mark-deep:oklch(.325 .155 262);                              /* 渐变深端 #002881。白字 12.96:1 */
      --mark-lift:oklch(.525 .188 250);                              /* 渐变亮端 #006AD0。白字 5.20:1 */
      --mark-bright:oklch(.650 .215 252);                            /* 全页最亮的蓝,只铺数据条,不承载文字 */
      --mark-bloom:oklch(.545 .175 250);                             /* 漂移光晕。@.38 压在最亮一档上,白字仍 5.12:1、次级 4.66:1 */

      /* ---- 语义色:本版承重。每档分两支 —— 文字墨承载文字,亮档只铺填充;
             wash 取亮档 14%、line 取亮档 40%,淡底比掺墨的旧法更透亮,文字墨压上去仍 ≥4.5:1 ---- */
      --pos:oklch(.500 .155 150);   --pos-bright:oklch(.615 .190 148);
      --neg:oklch(.540 .222 27);    --neg-bright:oklch(.618 .225 29);
      --warn:oklch(.532 .128 73);   --warn-bright:oklch(.660 .160 74);
      --pos-wash:color-mix(in oklab,var(--pos-bright) 14%,var(--surface));
      --neg-wash:color-mix(in oklab,var(--neg-bright) 14%,var(--surface));
      --warn-wash:color-mix(in oklab,var(--warn-bright) 14%,var(--surface));
      --mark-wash:color-mix(in oklab,var(--mark-bright) 14%,var(--surface));
      --pos-line:color-mix(in oklab,var(--pos-bright) 40%,var(--surface));
      --neg-line:color-mix(in oklab,var(--neg-bright) 40%,var(--surface));
      --warn-line:color-mix(in oklab,var(--warn-bright) 40%,var(--surface));
      --mark-line:color-mix(in oklab,var(--mark-bright) 40%,var(--surface));

      --ink-muted:oklch(.44 .028 264);                               /* 次级文字。对纸 7.8:1,对画布 7.1:1 */
      --ink-40:oklch(.62 .020 264);                                  /* 只用于图形,不承载文字 */
      --ink-08:color-mix(in oklab, var(--ink)  8%, var(--surface));
      --ink-05:color-mix(in oklab, var(--ink)  5%, var(--surface));
      --ink-03:color-mix(in oklab, var(--ink)  3%, var(--surface));
      --rule:var(--border);
      --on-mark:oklch(1 0 0);
      --on-mark-muted:color-mix(in oklab, oklch(1 0 0) 93%, var(--mark));  /* 对渐变最亮的一档(--mark-lift)4.81:1,光晕压过去之后仍 4.66:1;92% 时后者只剩 4.5 出头,不留余量 */
      --on-mark-rule:color-mix(in oklab, oklch(1 0 0) 44%, var(--mark));

      /* 字号阶梯:9 档,全整数。取 Klaviyo「一条梯子」的规矩,档位按中文密集界面选 */
      --fs-10:10px; --fs-11:11px; --fs-12:12px; --fs-13:13px; --fs-15:15px;
      --fs-19:19px; --fs-28:28px; --fs-34:34px; --fs-44:44px;
      /* 间距:4px 栅格。2px 只留给发丝线级别的微调,不作通用档位 */
      --sp-2:2px;   --sp-4:4px;   --sp-8:8px;   --sp-12:12px; --sp-16:16px;
      --sp-20:20px; --sp-24:24px; --sp-28:28px; --sp-32:32px; --sp-36:36px;
      --sp-40:40px; --sp-44:44px; --sp-48:48px; --sp-56:56px;
      /* 字重三档。规矩:&gt;=19px 的标题与结论数字用 bold,其余一律 semibold */
      --fw-normal:400; --fw-semibold:600; --fw-bold:700;
      /* 系列色:只区分类别(哪条策略/哪笔钱),不表示涨跌方向 —— 方向由 ▲▼ 与正负号说。
         取自 Klaviyo 品牌色阶,亮度落在白纸上条形填充可用的一档(对纸 ≥3:1) */
      --series-1:var(--mark);          /* 新会员复购 */
      --series-2:oklch(.630 .210 32);  /* 沉睡召回 —— Klaviyo poppy。#ED4428 对纸 3.86 */
      --series-3:oklch(.500 .215 350); /* 高价值提升 —— Klaviyo fig 提亮。#B00074 对纸 6.76 */

      --rail:232px;                    /* 左栏宽;收起态见 .rg-app.rail */
      --topbar:56px;

      --sans:Archivo,&quot;Noto Sans SC&quot;,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif;
      --ease:cubic-bezier(.16,1,.3,1);                                /* ease-out-expo,入场用,不回弹 */
      --ease-amb:cubic-bezier(.45,0,.55,1);                           /* 常驻漂移用对称缓动 */

      font-family:var(--sans);
      font-variant-numeric:tabular-nums;
      font-feature-settings:&quot;ss01&quot;;
      color-scheme:light;color:var(--ink);background:var(--canvas);
      display:block;height:100%;
    }

    /* 焦点环由本表保证;实心标记版上换成纸色,否则蓝环在蓝底上看不见 */
    #growth-engine :is(button,select,input,a,label):focus-visible{outline:2px solid var(--mark);outline-offset:2px;border-radius:var(--radius-sm)}
    #growth-engine .rg-lede :is(button,select,input,a):focus-visible{outline-color:var(--on-mark)}
    #growth-engine :is(button,select,input,label){touch-action:manipulation;-webkit-tap-highlight-color:transparent}
    #growth-engine *{box-sizing:border-box}
    #growth-engine :is(button,input,select){font:inherit}
    :where(#growth-engine) :where(button,input,select){color:inherit}

    @media (prefers-reduced-motion: reduce){
      #growth-engine *,#growth-engine *::before,#growth-engine *::after{
        animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
    }

    /* ---- 一次性入场:数字层揭幕 + 数据条拉出。终态即自然态,动画不跑也不丢内容 ---- */
    @keyframes rg-unveil{from{clip-path:inset(0 0 108% 0)}to{clip-path:inset(0 0 -8% 0)}}
    @keyframes rg-grow-x{from{transform:scaleX(0)}to{transform:scaleX(1)}}
    @keyframes rg-grow-y{from{transform:scaleY(0)}to{transform:scaleY(1)}}
    @keyframes rg-rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
    @keyframes rg-drift{from{transform:translate3d(-13%,-9%,0) scale(1)}to{transform:translate3d(13%,11%,0) scale(1.22)}}

    /* ============================================================================
       外壳:固定顶栏 + 固定左栏 + 独立滚动的工作区。粘性表头靠这个结构才是真的。
       ============================================================================ */
    #growth-engine .rg-app{
      height:100%;min-height:620px;position:relative;overflow:clip;
      background:var(--canvas);display:grid;grid-template-rows:var(--topbar) minmax(0,1fr)}

    /* ---- 顶栏:白面板 + 一根发丝线。搜索是真输入框,不是一个放大镜字形 ---- */
    #growth-engine .rg-top{
      height:var(--topbar);display:flex;align-items:center;gap:var(--sp-8);padding:0 var(--sp-16);
      background:var(--surface);border-bottom:1px solid var(--border);z-index:5}
    .rg-brand{display:flex;align-items:center;gap:var(--sp-8);padding-right:var(--sp-12);margin-right:var(--sp-4)}
    .rg-brand i{
      width:26px;height:26px;border-radius:var(--radius);background:var(--mark);color:var(--on-mark);
      display:grid;place-items:center;font-style:normal;font-size:var(--fs-13);font-weight:var(--fw-bold)}
    .rg-brand b{font-size:var(--fs-13);font-weight:var(--fw-semibold);letter-spacing:-.01em;white-space:nowrap}
    .rg-modules{display:flex;align-items:center;gap:var(--sp-2)}
    .rg-module{
      border:0;background:transparent;padding:var(--sp-8) var(--sp-12);cursor:pointer;border-radius:var(--radius);
      color:var(--ink-muted);font-size:var(--fs-13);white-space:nowrap;
      transition:color .16s var(--ease),background-color .16s var(--ease)}
    .rg-module:hover{color:var(--ink);background:var(--surface-3)}
    .rg-module.on{color:var(--mark);background:var(--mark-wash);font-weight:var(--fw-semibold)}
    .rg-top-tools{margin-left:auto;display:flex;align-items:center;gap:var(--sp-8)}
    /* 顶栏搜索:后台里这是常驻控件,不是装饰 */
    .rg-topsearch{position:relative;display:flex;align-items:center}
    .rg-topsearch span{position:absolute;left:var(--sp-8);color:var(--ink-muted);font-size:var(--fs-13);pointer-events:none}
    .rg-topsearch input{
      width:196px;height:32px;padding:0 var(--sp-8) 0 var(--sp-28);border:1px solid var(--border-input);
      border-radius:var(--radius);background:var(--surface);font-size:var(--fs-12);color:var(--ink)}
    .rg-topsearch input::placeholder{color:var(--ink-muted)}
    .rg-topsearch input:hover{border-color:var(--ink-40)}
    .rg-topsearch kbd{
      position:absolute;right:var(--sp-8);font:inherit;font-size:var(--fs-10);color:var(--ink-muted);
      border:1px solid var(--border);border-radius:var(--radius-sm);padding:0 var(--sp-4);background:var(--surface-2)}
    .rg-iconbtn{
      position:relative;width:32px;height:32px;display:grid;place-items:center;cursor:pointer;
      border:1px solid transparent;border-radius:var(--radius);background:transparent;color:var(--ink-muted);
      font-size:var(--fs-15);transition:background-color .16s var(--ease),color .16s var(--ease)}
    .rg-iconbtn:hover{background:var(--surface-3);color:var(--ink)}
    /* 未读标记:圆点 + 数字,数字本身也是信息通道,不只靠红点 */
    .rg-iconbtn b{
      position:absolute;top:2px;right:1px;min-width:15px;height:15px;padding:0 3px;border-radius:var(--radius-pill);
      background:var(--neg);color:oklch(1 0 0);font-size:var(--fs-10);font-weight:var(--fw-semibold);
      line-height:15px;text-align:center;border:1.5px solid var(--surface)}
    .rg-scope{
      display:flex;align-items:center;gap:var(--sp-4);height:32px;padding:0 var(--sp-8);cursor:pointer;
      border:1px solid var(--border-input);border-radius:var(--radius);background:var(--surface);
      color:var(--ink);font-size:var(--fs-12);white-space:nowrap}
    .rg-scope:hover{background:var(--surface-3)}
    .rg-scope small{color:var(--ink-muted);font-size:var(--fs-10)}
    .rg-user{display:flex;align-items:center;gap:var(--sp-8);border-left:1px solid var(--border);padding-left:var(--sp-12);margin-left:var(--sp-4)}
    .rg-avatar{
      width:28px;height:28px;border-radius:var(--radius-pill);display:grid;place-items:center;
      background:var(--mark);color:var(--on-mark);font-size:var(--fs-12);font-weight:var(--fw-semibold)}
    .rg-user b{display:block;color:var(--ink);font-size:var(--fs-12);font-weight:var(--fw-semibold);line-height:1.3}
    .rg-user small{display:block;color:var(--ink-muted);font-size:var(--fs-10);line-height:1.3}

    /* ---- 左栏:白面板 + 分组标签。当前项是一枚圆角实心块,不是整条色带 ---- */
    #growth-engine .rg-body{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);min-height:0}
    .rg-side{
      padding:var(--sp-12) var(--sp-8);display:flex;flex-direction:column;gap:var(--sp-2);overflow-y:auto;
      background:var(--surface);border-right:1px solid var(--border);color:var(--ink-muted)}
    .rg-navlabel{
      padding:var(--sp-12) var(--sp-12) var(--sp-4);font-size:var(--fs-10);font-weight:var(--fw-semibold);
      letter-spacing:.07em;text-transform:uppercase;color:var(--ink-muted);white-space:nowrap;overflow:hidden}
    .rg-side button[data-page]{
      border:0;background:transparent;color:var(--ink-muted);text-align:left;cursor:pointer;width:100%;
      display:flex;align-items:center;gap:var(--sp-12);white-space:nowrap;overflow:hidden;
      padding:var(--sp-8) var(--sp-12);border-radius:var(--radius);font-size:var(--fs-13);
      transition:background-color .16s var(--ease),color .16s var(--ease)}
    .rg-side button[data-page]:hover{background:var(--surface-3);color:var(--ink)}
    .rg-side button[data-page].on{background:var(--mark-wash);color:var(--mark);font-weight:var(--fw-semibold)}
    .rg-side button[data-page] span:first-child{display:inline-grid;place-items:center;width:18px;flex:none;font-size:var(--fs-13)}
    .rg-side button[data-page] em{
      margin-left:auto;font-style:normal;font-size:var(--fs-10);font-weight:var(--fw-semibold);
      background:var(--ink-08);color:var(--ink-muted);border-radius:var(--radius-pill);padding:1px var(--sp-8)}
    .rg-side button[data-page].on em{background:color-mix(in oklab,var(--mark) 18%,var(--surface));color:var(--mark)}
    .rg-side-foot{margin-top:auto;padding-top:var(--sp-12);border-top:1px solid var(--border);display:grid;gap:var(--sp-2)}
    .rg-side-foot button{
      border:0;background:transparent;color:var(--ink-muted);text-align:left;cursor:pointer;width:100%;
      display:flex;align-items:center;gap:var(--sp-12);white-space:nowrap;overflow:hidden;
      padding:var(--sp-8) var(--sp-12);border-radius:var(--radius);font-size:var(--fs-12);
      transition:background-color .16s var(--ease),color .16s var(--ease)}
    .rg-side-foot button:hover{background:var(--surface-3);color:var(--ink)}
    .rg-side-foot button span:first-child{display:inline-grid;place-items:center;width:18px;flex:none}
    /* 收起态:只剩图标,标签与分组名让位。宽度是唯一变化,不换一套结构 */
    #growth-engine .rg-app.rail{--rail:60px}
    .rg-app.rail .rg-navlabel{height:1px;padding:0;margin:var(--sp-12) var(--sp-8) var(--sp-4);
      background:var(--border);color:transparent;font-size:0}
    .rg-app.rail .rg-side button span:not(:first-child),
    .rg-app.rail .rg-side button em,
    .rg-app.rail .rg-brand b{display:none}
    .rg-app.rail .rg-side button{justify-content:center;padding-inline:var(--sp-8)}

    .rg-work{min-width:0;overflow-y:auto;overflow-x:hidden;background:var(--canvas);scroll-behavior:smooth}
    .rg-content{padding:var(--sp-20) var(--sp-24) var(--sp-32);min-width:0;position:relative;max-width:1420px}
    .rg-page{display:none}
    .rg-page.on{display:block}
    .rg-sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}

    /* ============================================================================
       页头:面包屑 → 标题 + 口径 → 右侧时间范围与主操作。截图即交付物,口径必须在框内。
       ============================================================================ */
    .rg-heading{
      display:flex;align-items:flex-end;justify-content:space-between;gap:var(--sp-16);
      padding-bottom:var(--sp-16);margin-bottom:var(--sp-16);border-bottom:1px solid var(--border)}
    .rg-heading h2{
      margin:0;font-size:var(--fs-28);font-weight:var(--fw-bold);letter-spacing:-.018em;
      font-stretch:104%;text-wrap:balance;line-height:1.2}
    .rg-heading p{margin:var(--sp-4) 0 0;font-size:var(--fs-12);color:var(--ink-muted);max-width:74ch;line-height:1.55}
    .rg-headactions{display:flex;align-items:center;gap:var(--sp-8);flex:none}
    .rg-breadcrumb{
      border:0;background:transparent;color:var(--ink-muted);font-size:var(--fs-12);cursor:pointer;
      padding:0 0 var(--sp-8);display:block;transition:color .16s var(--ease)}
    .rg-breadcrumb:hover{color:var(--mark);text-decoration:underline;text-underline-offset:3px}
    p.rg-breadcrumb{margin:0 0 var(--sp-8)}
    .rg-breadcrumb b{color:var(--ink);font-weight:var(--fw-semibold)}
    /* 时间范围:后台里它是常驻控件。口径写在标题下,范围写在这里,两者不重复 */
    .rg-daterange{
      display:flex;align-items:center;gap:var(--sp-8);height:32px;padding:0 var(--sp-12);cursor:pointer;
      border:1px solid var(--border-input);border-radius:var(--radius);background:var(--surface);
      color:var(--ink);font-size:var(--fs-12);white-space:nowrap}
    .rg-daterange:hover{background:var(--surface-3)}
    .rg-daterange span:first-child{color:var(--ink-muted)}

    /* ---- 按钮:后台里实心即主操作,渐变留给英雄块与数据条 ---- */
    .rg-primary,.rg-secondary{
      height:32px;display:inline-flex;align-items:center;gap:var(--sp-4);
      border-radius:var(--radius);padding:0 var(--sp-16);font-size:var(--fs-12);font-weight:var(--fw-semibold);
      cursor:pointer;white-space:nowrap;
      transition:background-color .16s var(--ease),border-color .16s var(--ease),box-shadow .16s var(--ease)}
    .rg-primary{border:1px solid var(--mark);background:var(--mark);color:var(--on-mark);box-shadow:var(--shadow-sm)}
    .rg-primary:hover{background:var(--mark-deep);border-color:var(--mark-deep)}
    .rg-secondary{border:1px solid var(--border-input);background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm)}
    .rg-secondary:hover{background:var(--surface-3)}
    .rg-primary:active,.rg-secondary:active{box-shadow:none;transform:translateY(1px)}
    .rg-primary:disabled{background:var(--ink-40);border-color:var(--ink-40);cursor:default;transform:none;box-shadow:none}
    .rg-link{
      border:0;background:transparent;color:var(--mark);font-size:var(--fs-12);font-weight:var(--fw-semibold);cursor:pointer;
      padding:var(--sp-4) 0;transition:color .16s var(--ease)}
    .rg-link:hover{color:var(--mark-deep);text-decoration:underline;text-underline-offset:3px}

    /* ---- 标签页:后台的二级导航 ---- */
    .rg-subnav{display:flex;gap:var(--sp-20);margin:0 0 var(--sp-16);border-bottom:1px solid var(--border)}
    .rg-subnav button{
      border:0;background:transparent;color:var(--ink-muted);cursor:pointer;
      padding:var(--sp-8) 0 var(--sp-12);font-size:var(--fs-13);
      box-shadow:inset 0 -2px 0 transparent;transition:color .16s var(--ease),box-shadow .16s var(--ease)}
    .rg-subnav button:hover{color:var(--ink)}
    .rg-subnav button.on{color:var(--mark);font-weight:var(--fw-semibold);box-shadow:inset 0 -2px 0 var(--mark)}

    /* ---- 徽标与状态胶囊 ----
       胶囊一律「圆点 + 文字」:底色是第二通道,不是唯一通道。
       done  蓝  = 已验证,随机控制实验归因通过
       ok    绿  = 运行中,数字在累积
       test  琥珀= 在学习,还没有可归因的数
       idle  灰  = 未启动 / 已停止 */
    .rg-badge{
      display:inline-flex;align-items:center;gap:var(--sp-4);
      font-size:var(--fs-11);padding:var(--sp-4) var(--sp-8);border-radius:var(--radius-pill);
      background:var(--mark-wash);color:var(--mark);border:1px solid var(--mark-line);
      font-weight:var(--fw-semibold);white-space:nowrap}
    .rg-status{
      display:inline-flex;align-items:center;gap:var(--sp-4);justify-self:start;
      font-size:var(--fs-11);padding:2px var(--sp-8);border-radius:var(--radius-pill);font-weight:var(--fw-semibold);
      background:var(--pos-wash);color:var(--pos);border:1px solid var(--pos-line);white-space:nowrap}
    .rg-status::before{content:&quot;&quot;;width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
    .rg-status.done{background:var(--mark-wash);color:var(--mark);border-color:var(--mark-line)}
    .rg-status.test{background:var(--warn-wash);color:var(--warn);border-color:var(--warn-line)}
    /* 测试态的点做成空心圈 —— 单色打印下它和实心点仍分得开 */
    .rg-status.test::before{background:transparent;box-shadow:inset 0 0 0 2px currentColor}
    .rg-status.idle{background:var(--ink-05);color:var(--ink-muted);border-color:var(--border)}
    .rg-status.idle::before{background:transparent;box-shadow:inset 0 0 0 2px currentColor}
    .rg-new-plan{background:var(--mark-wash)}

    /* ---- 涨跌:颜色 + 字形 + 符号三重编码。去掉颜色仍读得出方向 ---- */
    .rg-pos,.rg-neg,.rg-flat{font-size:var(--fs-12);font-weight:var(--fw-semibold);white-space:nowrap}
    .rg-pos{color:var(--pos)}
    .rg-neg{color:var(--neg)}
    .rg-flat{color:var(--ink-muted)}
    .rg-delta{display:inline-flex;align-items:center;gap:3px;font-size:var(--fs-11);font-weight:var(--fw-semibold);white-space:nowrap}
    .rg-delta.up{color:var(--pos)}
    .rg-delta.down{color:var(--neg)}
    .rg-delta.flat{color:var(--ink-muted)}
    .rg-delta i{font-style:normal;font-size:9px;line-height:1}
    .rg-delta small{color:var(--ink-muted);font-weight:var(--fw-normal);font-size:var(--fs-11)}

    /* ============================================================================
       英雄块:概览页的结论面板。整版实心标记墨,结论与它的推导印在同一块版上。
       ============================================================================ */
    .rg-lede{
      position:relative;overflow:hidden;isolation:isolate;border-radius:var(--radius-lg);box-shadow:var(--shadow-md);
      background:linear-gradient(146deg,var(--mark-deep) 0%,var(--mark) 48%,var(--mark-lift) 100%);
      color:var(--on-mark);padding:var(--sp-24) var(--sp-28);
      display:grid;grid-template-columns:minmax(0,1fr) minmax(230px,.42fr);
      align-items:end;column-gap:var(--sp-36);row-gap:var(--sp-20)}
    /* 光晕在自己的图层里漂,只动 transform,不碰布局属性 */
    .rg-lede::before{
      content:&quot;&quot;;position:absolute;inset:-45%;z-index:-1;pointer-events:none;
      background:radial-gradient(closest-side,var(--mark-bloom),transparent 72%);
      opacity:.38;will-change:transform;
      animation:rg-drift 26s var(--ease-amb) infinite alternate}
    .rg-claim-label{
      display:block;font-size:var(--fs-11);font-weight:var(--fw-semibold);color:var(--on-mark-muted);
      letter-spacing:.01em;margin-bottom:var(--sp-4)}
    .rg-claim b{
      display:block;font-size:clamp(44px,6.4vw,72px);line-height:.95;font-weight:var(--fw-bold);
      font-stretch:112%;letter-spacing:-.032em;white-space:nowrap;
      animation:rg-unveil 820ms var(--ease) backwards}
    .rg-claim b em{font-style:normal;font-size:.42em;font-weight:var(--fw-semibold);letter-spacing:0;margin-left:.06em}
    .rg-derivation{
      margin:var(--sp-12) 0 0;padding-top:var(--sp-12);border-top:1px solid var(--on-mark-rule);
      font-size:var(--fs-12);line-height:1.62;color:var(--on-mark);max-width:58ch}
    .rg-derivation em{font-style:normal;color:var(--on-mark-muted)}
    .rg-roi{border-left:1px solid var(--on-mark-rule);padding-left:var(--sp-24)}
    .rg-roi dt{font-size:var(--fs-11);font-weight:var(--fw-semibold);color:var(--on-mark-muted);margin-bottom:var(--sp-8)}
    .rg-roi dd{margin:0}
    .rg-roi-eq{font-size:var(--fs-11);color:var(--on-mark-muted);line-height:1.7}
    .rg-roi-out{
      display:block;font-size:var(--fs-34);font-weight:var(--fw-bold);font-stretch:112%;letter-spacing:-.025em;
      line-height:1;margin-top:var(--sp-8)}

    /* ============================================================================
       指标卡:后台的第一排。标签 → 数字 → 与基准的差 → 口径。
       差值一律「▲/▼ + 正负号 + 数值 + 比什么」,颜色只是第四层冗余。
       ============================================================================ */
    #growth-engine .rg-grid4{
      display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--sp-12)}
    #growth-engine .rg-grid4 .rg-card{
      background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
      box-shadow:var(--shadow-sm);padding:var(--sp-16)}
    #growth-engine .rg-grid4:has(.rg-kpi-lead){grid-template-columns:repeat(5,minmax(0,1fr))}
    .rg-kpi-lead{grid-column:span 2}
    .rg-kpi span{display:block;font-size:var(--fs-11);color:var(--ink-muted);font-weight:var(--fw-semibold);letter-spacing:.01em}
    .rg-kpi b{display:block;font-size:var(--fs-28);font-weight:var(--fw-bold);font-stretch:106%;letter-spacing:-.022em;margin:var(--sp-8) 0 var(--sp-4);line-height:1.1}
    .rg-kpi small{display:block;font-size:var(--fs-11);color:var(--ink-muted);line-height:1.5}
    .rg-kpi .rg-delta{margin-bottom:var(--sp-4)}
    .rg-kpi-lead b{
      font-size:clamp(40px,5.4vw,58px);line-height:1;letter-spacing:-.034em;font-stretch:112%;
      margin:var(--sp-8) 0 var(--sp-8);font-weight:var(--fw-bold);white-space:nowrap;
      animation:rg-unveil 760ms var(--ease) backwards}
    .rg-grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--sp-12)}
    .rg-grid2{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-12)}
    .rg-split{display:grid;grid-template-columns:minmax(0,1.32fr) minmax(280px,.68fr);gap:var(--sp-16);align-items:start}

    /* ---- 面板:白底 + 边线 + 8px 圆角 + 一档极淡投影 ---- */
    .rg-card{
      background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
      box-shadow:var(--shadow-sm);padding:0;overflow:clip}
    .rg-card-title{
      display:flex;justify-content:space-between;align-items:center;gap:var(--sp-12);
      font-size:var(--fs-13);font-weight:var(--fw-semibold);letter-spacing:-.005em;
      padding:var(--sp-12) var(--sp-16);border-bottom:1px solid var(--border);background:var(--surface)}
    .rg-card-title .rg-muted{font-weight:var(--fw-normal)}
    .rg-cardbody{padding:var(--sp-16)}
    .rg-muted{font-size:var(--fs-12);color:var(--ink-muted)}

    /* ---- 表格工具条:搜索 / 筛选片 / 结果计数 / 次级操作 ---- */
    .rg-toolbar{
      display:flex;align-items:center;gap:var(--sp-8);flex-wrap:wrap;
      padding:var(--sp-8) var(--sp-16);border-bottom:1px solid var(--border);background:var(--surface-2)}
    .rg-search{position:relative;display:flex;align-items:center}
    .rg-search span{position:absolute;left:var(--sp-8);color:var(--ink-muted);font-size:var(--fs-12);pointer-events:none}
    .rg-search input{
      width:208px;height:28px;padding:0 var(--sp-8) 0 var(--sp-24);border:1px solid var(--border-input);
      border-radius:var(--radius);background:var(--surface);font-size:var(--fs-12);color:var(--ink)}
    .rg-search input::placeholder{color:var(--ink-muted)}
    .rg-chip{
      display:inline-flex;align-items:center;gap:var(--sp-4);height:28px;padding:0 var(--sp-8);cursor:pointer;
      border:1px solid var(--border-input);border-radius:var(--radius);background:var(--surface);
      color:var(--ink);font-size:var(--fs-12);white-space:nowrap;
      transition:background-color .16s var(--ease),border-color .16s var(--ease)}
    .rg-chip:hover{background:var(--surface-3)}
    .rg-chip.on{background:var(--mark-wash);border-color:var(--mark);color:var(--mark);font-weight:var(--fw-semibold)}
    .rg-chip small{color:var(--ink-muted);font-size:var(--fs-10)}
    .rg-chip.on small{color:var(--mark)}
    .rg-count{margin-left:auto;font-size:var(--fs-11);color:var(--ink-muted);white-space:nowrap}
    .rg-count b{color:var(--ink);font-weight:var(--fw-semibold)}

    /* ---- 表格:粘性表头、可排序列、数字右对齐、行操作 ---- */
    .rg-tablewrap{min-width:0}
    .rg-table{width:100%;border-collapse:separate;border-spacing:0;font-size:var(--fs-12)}
    .rg-table th,.rg-table td{text-align:left;padding:var(--sp-12) var(--sp-16);border-bottom:1px solid var(--border);vertical-align:middle}
    .rg-table thead th{
      position:sticky;top:0;z-index:2;background:var(--surface-2);
      font-weight:var(--fw-semibold);color:var(--ink-muted);font-size:var(--fs-11);letter-spacing:.03em;
      text-transform:uppercase;white-space:nowrap;padding-block:var(--sp-8)}
    .rg-table tbody tr{transition:background-color .12s var(--ease)}
    .rg-table tbody tr:hover{background:var(--surface-3)}
    .rg-table tbody tr:last-child td{border-bottom:0}
    /* 数字列右对齐 —— 后台表里这一条比任何装饰都值钱 */
    .rg-table :is(th,td).num{text-align:right;font-variant-numeric:tabular-nums}
    .rg-table :is(th,td).act{text-align:right;width:1%;white-space:nowrap}
    .rg-sort{
      display:inline-flex;align-items:center;gap:var(--sp-4);border:0;background:transparent;cursor:pointer;
      color:inherit;font:inherit;letter-spacing:inherit;text-transform:inherit;padding:0;
      transition:color .16s var(--ease)}
    .rg-sort:hover{color:var(--ink)}
    .rg-sort i{font-style:normal;font-size:9px;opacity:.45;transition:opacity .16s var(--ease)}
    th[aria-sort=&quot;ascending&quot;] .rg-sort,th[aria-sort=&quot;descending&quot;] .rg-sort{color:var(--mark)}
    th[aria-sort=&quot;ascending&quot;] .rg-sort i,th[aria-sort=&quot;descending&quot;] .rg-sort i{opacity:1}
    .rg-table :is(th,td).num .rg-sort{justify-content:flex-end;width:100%}
    .rg-rowmenu{
      width:26px;height:26px;display:inline-grid;place-items:center;border:1px solid transparent;border-radius:var(--radius);
      background:transparent;color:var(--ink-muted);cursor:pointer;font-size:var(--fs-13);
      transition:background-color .16s var(--ease),border-color .16s var(--ease),color .16s var(--ease)}
    .rg-rowmenu:hover{background:var(--surface);border-color:var(--border-input);color:var(--ink)}
    .rg-provider{display:block;color:var(--ink-muted);font-size:var(--fs-11);margin-top:2px;font-weight:var(--fw-normal)}
    .rg-decision{
      display:inline-flex;align-items:center;gap:var(--sp-4);font-size:var(--fs-11);font-weight:var(--fw-semibold);
      padding:2px var(--sp-8);border-radius:var(--radius-pill);border:1px solid var(--border);background:var(--ink-05);color:var(--ink-muted)}
    .rg-decision.up{background:var(--pos-wash);color:var(--pos);border-color:var(--pos-line)}
    .rg-decision.down{background:var(--neg-wash);color:var(--neg);border-color:var(--neg-line)}
    .rg-decision.test{background:var(--warn-wash);color:var(--warn);border-color:var(--warn-line)}
    /* ---- 表脚:结果计数 + 分页。后台表不能没有这一行 ---- */
    .rg-tablefoot b{color:var(--ink);font-weight:var(--fw-semibold)}
    .rg-tablefoot{
      display:flex;align-items:center;justify-content:space-between;gap:var(--sp-12);
      padding:var(--sp-8) var(--sp-16);border-top:1px solid var(--border);background:var(--surface-2);
      font-size:var(--fs-11);color:var(--ink-muted)}
    .rg-pager{display:flex;align-items:center;gap:var(--sp-4)}
    .rg-pager button{
      min-width:26px;height:26px;padding:0 var(--sp-4);border:1px solid var(--border-input);border-radius:var(--radius);
      background:var(--surface);color:var(--ink);font-size:var(--fs-11);cursor:pointer}
    .rg-pager button:hover:not(:disabled){background:var(--surface-3)}
    .rg-pager button.on{background:var(--mark);border-color:var(--mark);color:var(--on-mark);font-weight:var(--fw-semibold)}
    .rg-pager button:disabled{color:var(--ink-40);cursor:default}
    /* ---- 空态:搜索无命中时说清楚「搜了什么、怎么退回去」 ---- */
    .rg-empty{display:none;padding:var(--sp-40) var(--sp-16);text-align:center}
    .rg-empty.on{display:block}
    .rg-empty i{
      display:inline-grid;place-items:center;width:40px;height:40px;border-radius:var(--radius-pill);
      background:var(--ink-05);color:var(--ink-muted);font-style:normal;font-size:var(--fs-15);margin-bottom:var(--sp-12)}
    .rg-empty b{display:block;font-size:var(--fs-13);font-weight:var(--fw-semibold);margin-bottom:var(--sp-4)}
    .rg-empty p{margin:0 0 var(--sp-12);font-size:var(--fs-12);color:var(--ink-muted)}

    /* ---- AI 建议:整框墨线 + 实心墨方块 ---- */
    .rg-ai{
      margin-top:var(--sp-16);padding:var(--sp-12) var(--sp-16);border:1px solid var(--border);
      border-radius:var(--radius-lg);background:var(--surface);box-shadow:var(--shadow-sm);
      display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:var(--sp-12);align-items:center}
    .rg-ai-icon{
      width:30px;height:30px;border-radius:var(--radius);background:var(--ink);color:var(--surface);
      display:grid;place-items:center;font-size:var(--fs-11);font-weight:var(--fw-semibold);letter-spacing:.02em}
    .rg-ai b{font-size:var(--fs-12)}
    .rg-ai p{font-size:var(--fs-12);color:var(--ink-muted);margin:var(--sp-4) 0 0;line-height:1.55;max-width:76ch}
    .rg-ai strong{color:var(--ink);font-weight:var(--fw-semibold);box-shadow:inset 0 -.42em 0 var(--mark-wash)}

    /* ---- 计划行:表格之外的一种密集行 ---- */
    #growth-engine .rg-plan{
      display:grid;grid-template-columns:minmax(0,1.3fr) .6fr .6fr .62fr .62fr auto;
      align-items:center;gap:var(--sp-12);padding:var(--sp-12) var(--sp-16);border-bottom:1px solid var(--border);font-size:var(--fs-12);
      transition:background-color .12s var(--ease)}
    .rg-plan:hover{background:var(--surface-3)}
    .rg-plan:last-child{border-bottom:0}
    .rg-plan b{font-size:var(--fs-12);display:block;font-weight:var(--fw-semibold)}
    .rg-plan .rg-delta,.rg-table .rg-delta{display:flex;margin-top:2px}
    .rg-table .num .rg-delta{justify-content:flex-end}
    .rg-metric{display:block;font-weight:var(--fw-semibold)}
    .rg-plan.hide{display:none}
    .rg-table tr.hide{display:none}
    .rg-progress{height:4px;background:var(--ink-08);border-radius:var(--radius-pill);margin-top:var(--sp-8);overflow:hidden;max-width:260px}
    .rg-progress i{display:block;height:100%;border-radius:var(--radius-pill);background:linear-gradient(90deg,var(--mark-deep),var(--mark) 62%,var(--mark-bright));transform-origin:left}
    .rg-page.on .rg-progress i{animation:rg-grow-x 700ms var(--ease) backwards}

    .rg-actions{display:flex;justify-content:flex-end;gap:var(--sp-8);margin-top:var(--sp-16)}

    /* ---- 结论条 ---- */
    .rg-opportunity{
      margin:var(--sp-16);padding:var(--sp-12) var(--sp-16);background:var(--mark-wash);
      border:1px solid var(--mark-line);border-radius:var(--radius);
      font-size:var(--fs-12);line-height:1.6}

    /* ---- 实验组对照:对照组空心、实验组实心标记墨 ---- */
    .rg-bars{
      height:238px;display:flex;align-items:flex-end;justify-content:center;gap:var(--sp-56);
      padding:var(--sp-36) var(--sp-20) 0;border-bottom:1px solid var(--border);position:relative}
    .rg-vbar{width:100px;text-align:center;position:relative}
    .rg-vbar i{display:block;background:var(--ink-08);border:1px solid var(--ink-40);border-radius:var(--radius) var(--radius) 0 0;transform-origin:bottom}
    .rg-page.on .rg-vbar i{animation:rg-grow-y 760ms var(--ease) backwards}
    .rg-page.on .rg-vbar.test i{animation-delay:110ms}
    .rg-vbar.test i{background:linear-gradient(180deg,var(--mark-bright),var(--mark) 50%,var(--mark-deep));border-color:var(--mark-deep)}
    .rg-vbar b{position:absolute;top:-24px;left:0;width:100%;font-size:var(--fs-15);font-weight:var(--fw-semibold)}
    .rg-vbar span{display:block;font-size:var(--fs-11);color:var(--ink-muted);margin-top:var(--sp-8);line-height:1.45}
    .rg-lift{position:absolute;top:6px;left:0;width:100%;text-align:center;color:var(--pos);font-size:var(--fs-13);font-weight:var(--fw-semibold)}
    .rg-formula{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border-top:1px solid var(--border)}
    .rg-formula div{padding:var(--sp-12) var(--sp-16);border-left:1px solid var(--border)}
    .rg-formula div:first-child{border-left:0}
    .rg-formula span{display:block;font-size:var(--fs-11);color:var(--ink-muted)}
    .rg-formula b{display:block;margin-top:var(--sp-4);font-size:var(--fs-13);font-weight:var(--fw-semibold)}
    .rg-audit{display:grid;gap:0}
    .rg-audit div{display:flex;justify-content:space-between;gap:var(--sp-12);border-bottom:1px solid var(--border);padding:var(--sp-8) var(--sp-16);font-size:var(--fs-12)}
    .rg-audit span{color:var(--ink-muted)}
    .rg-audit b{font-weight:var(--fw-semibold)}

    /* ---- 预算分配 ---- */
    .rg-allocate{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-16);align-items:start}
    .rg-budget-row{
      display:grid;grid-template-columns:minmax(0,1.1fr) .8fr .8fr .7fr;gap:var(--sp-12);align-items:center;
      padding:var(--sp-12) var(--sp-16);border-bottom:1px solid var(--border);font-size:var(--fs-12)}
    .rg-budget-row:last-child{border-bottom:0}
    .rg-budget-row b{font-weight:var(--fw-semibold)}
    .rg-budget-bar{height:5px;background:var(--ink-08);border-radius:var(--radius-pill);overflow:hidden}
    .rg-budget-bar i{display:block;height:100%;border-radius:var(--radius-pill);background:linear-gradient(90deg,var(--mark-deep),var(--mark) 62%,var(--mark-bright));transform-origin:left}
    .rg-page.on .rg-budget-bar i{animation:rg-grow-x 700ms var(--ease) backwards}
    /* 同一条策略在「计划表现」和「投入构成」两个视图里是同一个颜色 —— 这是多色唯一挣到的信息。
       系列色只区分类别,不表示方向;方向仍由 ▲▼ 与正负号说 */
    :is(.rg-plan,.rg-budget-row)[data-series=&quot;2&quot;] :is(.rg-progress,.rg-budget-bar) i{
      background:linear-gradient(90deg,
        color-mix(in oklab,var(--series-2) 72%,var(--ink)),
        var(--series-2) 62%,
        color-mix(in oklab,var(--series-2) 88%,var(--surface)))}
    :is(.rg-plan,.rg-budget-row)[data-series=&quot;3&quot;] :is(.rg-progress,.rg-budget-bar) i{
      background:linear-gradient(90deg,
        color-mix(in oklab,var(--series-3) 72%,var(--ink)),
        var(--series-3) 62%,
        color-mix(in oklab,var(--series-3) 88%,var(--surface)))}
    .rg-reason{font-size:var(--fs-11);color:var(--ink-muted);margin-top:2px}
    .rg-tool{
      display:grid;grid-template-columns:28px minmax(0,1fr) auto;align-items:center;gap:var(--sp-12);
      padding:var(--sp-12) var(--sp-16);border-bottom:1px solid var(--border);font-size:var(--fs-12)}
    .rg-tool:last-child{border-bottom:0}
    .rg-tool-icon{
      width:28px;height:28px;border-radius:var(--radius);background:var(--ink-05);border:1px solid var(--border);
      color:var(--ink);display:grid;place-items:center;font-weight:var(--fw-semibold);font-size:var(--fs-12)}
    .rg-tool b{display:block;font-weight:var(--fw-semibold)}
    .rg-tool span{color:var(--ink-muted)}

    /* ---- 瀑布图 ---- */
    .rg-waterfall{height:228px;display:flex;align-items:flex-end;gap:var(--sp-12);border-bottom:1px solid var(--border);padding:0 var(--sp-16)}
    .rg-wf{flex:1;text-align:center;font-size:var(--fs-11);color:var(--ink-muted)}
    .rg-wf i{display:block;border-radius:var(--radius) var(--radius) 0 0;margin-bottom:var(--sp-8);transform-origin:bottom;
      background:linear-gradient(180deg,var(--mark-bright),var(--mark) 55%,var(--mark-deep))}
    .rg-page.on .rg-wf i{animation:rg-grow-y 700ms var(--ease) backwards}
    .rg-wf:nth-child(2) i{animation-delay:70ms}.rg-wf:nth-child(3) i{animation-delay:140ms}
    .rg-wf:nth-child(4) i{animation-delay:210ms}.rg-wf:nth-child(5) i{animation-delay:280ms}
    /* 成本柱:减项。用空心 + 负号,不靠红色说「这是减的」 */
    .rg-wf.cost i{background:var(--ink-05);border:1px solid var(--ink-40)}
    .rg-wf b{display:block;font-size:var(--fs-12);color:var(--ink);margin-bottom:var(--sp-4);font-weight:var(--fw-semibold)}

    /* ---- 结论清单 ---- */
    .rg-summary{display:grid;gap:0}
    .rg-summary-item{padding:var(--sp-12) var(--sp-16);border-bottom:1px solid var(--border);font-size:var(--fs-12);line-height:1.6;color:var(--ink-muted)}
    .rg-summary-item:last-child{border-bottom:0}
    .rg-summary-item b{display:block;margin-bottom:2px;font-size:var(--fs-12);font-weight:var(--fw-semibold);color:var(--ink)}

    .rg-toast{
      position:fixed;right:20px;bottom:20px;z-index:40;background:var(--ink);color:var(--surface);
      padding:var(--sp-12) var(--sp-16);border-radius:var(--radius);box-shadow:var(--shadow-pop);
      font-size:var(--fs-12);max-width:min(360px,calc(100% - 40px));
      opacity:0;transform:translateY(8px);transition:opacity .24s var(--ease),transform .24s var(--ease);pointer-events:none}
    .rg-toast.show{opacity:1;transform:none}

    /* ---- 向导 ---- */
    #growth-engine .rg-modal-wrap{
      position:absolute;inset:0;z-index:30;overscroll-behavior:contain;padding:var(--sp-24);
      background:color-mix(in oklab, var(--ink) 55%, transparent);display:none;align-items:center;justify-content:center}
    #growth-engine .rg-modal-wrap.on{display:flex}
    .rg-modal{
      width:min(780px,100%);max-height:100%;overflow:auto;background:var(--surface);
      border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-pop);
      animation:rg-rise 280ms var(--ease) backwards}
    .rg-modal-head{padding:var(--sp-16) var(--sp-20);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
    .rg-modal-head h2{font-size:var(--fs-19);margin:0;font-weight:var(--fw-bold);letter-spacing:-.015em}
    .rg-close{border:0;background:transparent;color:var(--ink-muted);cursor:pointer;font-size:var(--fs-15);line-height:1;padding:var(--sp-4);border-radius:var(--radius)}
    .rg-close:hover{background:var(--surface-3);color:var(--ink)}
    .rg-wizard-steps{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--border);background:var(--surface-2)}
    .rg-wizard-step{
      padding:var(--sp-12) var(--sp-8);text-align:center;font-size:var(--fs-12);color:var(--ink-muted);
      box-shadow:inset 0 -2px 0 transparent;transition:color .2s var(--ease),box-shadow .2s var(--ease)}
    .rg-wizard-step.on{color:var(--mark);font-weight:var(--fw-semibold);box-shadow:inset 0 -2px 0 var(--mark);background:var(--surface)}
    .rg-wizard-body{padding:var(--sp-20);min-height:410px}
    .rg-wizard-pane{display:none}
    .rg-wizard-pane.on{display:block;animation:rg-rise 260ms var(--ease) backwards}
    .rg-choice-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--sp-12)}
    .rg-choice{
      border:1px solid var(--border-input);background:var(--surface);border-radius:var(--radius-lg);padding:var(--sp-12);text-align:left;cursor:pointer;
      transition:border-color .16s var(--ease),background-color .16s var(--ease),box-shadow .16s var(--ease)}
    .rg-choice:hover{border-color:var(--ink-40);box-shadow:var(--shadow-sm)}
    .rg-choice.on{border-color:var(--mark);background:var(--mark-wash);box-shadow:inset 0 0 0 1px var(--mark)}
    .rg-choice b{font-size:var(--fs-13);display:block;font-weight:var(--fw-semibold)}
    .rg-choice span{font-size:var(--fs-12);color:var(--ink-muted);display:block;margin-top:var(--sp-8);line-height:1.55}
    .rg-field-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-16)}
    .rg-field{margin-bottom:var(--sp-16)}
    .rg-field label{display:flex;justify-content:space-between;gap:var(--sp-8);font-size:var(--fs-12);margin-bottom:var(--sp-8)}
    .rg-field label b{font-weight:var(--fw-semibold)}
    .rg-field select,.rg-field input[type=text]{
      width:100%;border:1px solid var(--border-input);background:var(--surface);border-radius:var(--radius);
      padding:var(--sp-8) var(--sp-12);font-size:var(--fs-12)}
    .rg-field select:hover,.rg-field input[type=text]:hover{border-color:var(--ink-40)}
    .rg-field input[type=range]{width:100%;accent-color:var(--mark)}
    .rg-guard{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-8);margin-top:var(--sp-12)}
    .rg-guard label{font-size:var(--fs-12);display:flex;align-items:center;gap:var(--sp-8)}
    .rg-guard input{accent-color:var(--mark)}
    .rg-feasibility{display:grid;grid-template-columns:132px minmax(0,1fr);gap:var(--sp-24);align-items:center}
    .rg-score{
      width:126px;height:126px;border-radius:50%;display:grid;place-items:center;position:relative;
      background:conic-gradient(var(--mark-deep) 0%,var(--mark) 84%,var(--ink-08) 84%)}
    .rg-score:before{content:&quot;&quot;;position:absolute;width:96px;height:96px;border-radius:50%;background:var(--surface)}
    .rg-score b{position:relative;font-size:var(--fs-34);font-weight:var(--fw-bold);font-stretch:106%;letter-spacing:-.025em}
    .rg-plan-preview{margin-top:var(--sp-16)}
    .rg-review{display:grid;grid-template-columns:1fr 1fr;gap:0;border-top:1px solid var(--border)}
    .rg-review div{padding:var(--sp-12) var(--sp-16) var(--sp-12) 0;border-bottom:1px solid var(--border)}
    .rg-review span{font-size:var(--fs-11);color:var(--ink-muted);display:block}
    .rg-review b{font-size:var(--fs-13);display:block;margin-top:2px;font-weight:var(--fw-semibold)}
    .rg-modal-foot{padding:var(--sp-12) var(--sp-20);border-top:1px solid var(--border);display:flex;justify-content:space-between;gap:var(--sp-12);background:var(--surface-2)}
    .rg-modal-right{display:flex;gap:var(--sp-8)}

    /* ---- 生态工具授权 ---- */
    .rg-eco-title{margin-top:var(--sp-20)}
    .rg-eco-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--sp-8);margin-top:var(--sp-12)}
    .rg-eco-card{
      border:1px solid var(--border-input);background:var(--surface);border-radius:var(--radius);padding:var(--sp-12);
      display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:var(--sp-8);align-items:center;cursor:pointer;
      transition:border-color .16s var(--ease),box-shadow .16s var(--ease)}
    .rg-eco-card:hover{border-color:var(--ink-40);box-shadow:var(--shadow-sm)}
    .rg-eco-card:has(input:checked){border-color:var(--mark)}
    .rg-eco-card.off{background:var(--surface-2);cursor:default}
    .rg-eco-logo{
      width:30px;height:30px;border-radius:var(--radius);background:var(--ink-05);border:1px solid var(--border);
      color:var(--ink);display:grid;place-items:center;font-size:var(--fs-10);font-weight:var(--fw-semibold)}
    .rg-eco-card.off .rg-eco-logo{color:var(--ink-muted)}
    .rg-eco-card b{font-size:var(--fs-12);display:block;font-weight:var(--fw-semibold)}
    .rg-eco-card small{font-size:var(--fs-11);color:var(--ink-muted)}
    .rg-eco-card input{accent-color:var(--mark)}
    .rg-eco-connect{
      border:1px solid var(--mark);background:transparent;color:var(--mark);font-size:var(--fs-11);
      font-weight:var(--fw-semibold);cursor:pointer;padding:var(--sp-4) var(--sp-8);border-radius:var(--radius)}
    .rg-eco-connect:hover{background:var(--mark);color:var(--on-mark)}
    .rg-eco-note{font-size:var(--fs-11);color:var(--ink-muted);margin:var(--sp-8) 0 0;line-height:1.55}
    .rg-tool-matrix{margin-top:var(--sp-16)}

    /* ---- 窗口收窄时的兜底 ----
       目标设备是会议室里的笔记本与投影;手机不是目标,这里不做手机版式。
       这几段只保证窗口被拖窄时不横向裂开、大字号不溢出容器。 ---- */
    @media(max-width:1240px){
      #growth-engine .rg-grid4{grid-template-columns:repeat(2,minmax(0,1fr))}
      #growth-engine .rg-grid4:has(.rg-kpi-lead){grid-template-columns:repeat(2,minmax(0,1fr))}
      .rg-kpi-lead{grid-column:1/-1}
      .rg-topsearch input{width:150px}
    }
    @media(max-width:1080px){
      #growth-engine .rg-split,.rg-allocate{grid-template-columns:1fr}
      .rg-lede{grid-template-columns:1fr}
      .rg-roi{border-left:0;border-top:1px solid var(--on-mark-rule);padding:var(--sp-16) 0 0}
      .rg-eco-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
      #growth-engine .rg-app{--rail:60px}
      .rg-app .rg-navlabel{height:1px;padding:0;margin:var(--sp-12) var(--sp-8) var(--sp-4);background:var(--border);color:transparent;font-size:0}
      .rg-app .rg-side button span:not(:first-child),.rg-app .rg-side button em,.rg-app .rg-brand b{display:none}
      .rg-app .rg-side button{justify-content:center;padding-inline:var(--sp-8)}
      .rg-collapse{display:none}
    }
    @media(max-width:860px){
      #growth-engine .rg-modules,.rg-topsearch,.rg-scope{display:none}
      #growth-engine .rg-body{grid-template-columns:1fr}
      .rg-side{display:none}
      .rg-content{padding:var(--sp-16) var(--sp-16) var(--sp-28)}
      .rg-heading{flex-direction:column;align-items:flex-start;gap:var(--sp-12)}
      .rg-lede{padding:var(--sp-20)}
      .rg-claim b{font-size:clamp(40px,11vw,56px)}
      .rg-roi-out{font-size:var(--fs-28)}
      #growth-engine .rg-grid4,.rg-grid3,.rg-grid2{grid-template-columns:repeat(2,minmax(0,1fr))}
      .rg-plan{grid-template-columns:1fr 1fr}
      .rg-plan&gt;*:first-child{grid-column:1/-1}
      .rg-formula{grid-template-columns:1fr 1fr}
      .rg-formula div:nth-child(odd){border-left:0}
      .rg-bars{gap:var(--sp-28);padding-top:var(--sp-40)}
      .rg-vbar{width:auto;flex:1;max-width:120px}
      .rg-user b,.rg-user small{display:none}
      .rg-choice-grid,.rg-field-grid,.rg-review,.rg-eco-grid,.rg-guard{grid-template-columns:1fr}
      .rg-review div{padding-right:0}
      .rg-wizard-body{min-height:560px}
      .rg-wizard-step{font-size:var(--fs-11);padding:var(--sp-8) var(--sp-4)}
      .rg-feasibility{grid-template-columns:1fr;justify-items:start}
      .rg-toolbar{gap:var(--sp-4)}
      .rg-search input{width:140px}
      .rg-tablewrap{overflow-x:auto}
    }

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {

  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }

    const request = ++positionRequest;

      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,

              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }

  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);

  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }

    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
